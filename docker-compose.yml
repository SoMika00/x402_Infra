services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: x402
      POSTGRES_USER: x402
      POSTGRES_PASSWORD: x402
    ports: ["5432:5432"]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U x402 -d x402" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]
    restart: unless-stopped
    volumes:
      - ./:/app

volumes:
  pgdata:
