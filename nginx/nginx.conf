worker_processes auto;
events { worker_connections 4096; }

http {
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 4096;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  gzip on;

  # rate limit simple par IP (300 req/min)
  limit_req_zone $binary_remote_addr zone=rl:10m rate=5r/s;

  upstream x402_api {
    server api0:8080 max_fails=3 fail_timeout=10s;
    server api1:8080 max_fails=3 fail_timeout=10s;
  }

  map $http_x_payment $has_payment {
    default 0;
    ""      0;
    ~.      1;
  }

  server {
    listen 80;
    server_name _;

    # Expose les headers de règlement au JS (CORS)
    add_header Access-Control-Expose-Headers "X-PAYMENT-RESPONSE, X-PAYER, X-TX-HASH" always;

    location = /metrics {
      allow 127.0.0.1;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://x402_api/metrics;
      proxy_set_header Host $host;
    }

    location / {
      limit_req zone=rl burst=30 nodelay;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # IMPORTANT: forward des headers x402 + idempotency
      proxy_set_header X-PAYMENT        $http_x_payment;
      proxy_set_header X-402-Proof      $http_x_402_proof;
      proxy_set_header Idempotency-Key  $http_idempotency_key;

      proxy_pass http://x402_api;
      proxy_http_version 1.1;
      proxy_read_timeout 120s;
    }
  }
}
